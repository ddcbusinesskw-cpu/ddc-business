<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DDC Business — تقييم النضج المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#1d1d1f; --dark:#000; --white:#fff;
    --gray1:#f5f5f7; --gray2:#6e6e73; --gray3:#86868b; --border:#d2d2d7;
    --blue:#0071e3; --blue2:#147ce5;
    --red:#ff453a; --amber:#ff9f0a; --green:#30d158;
    --radius:18px;
    --maxw:560px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;
    background:var(--white); color:var(--black);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .display{font-family:'Bebas Neue','DM Sans',sans-serif; letter-spacing:.01em;}
  .wrap{width:100%; max-width:var(--maxw); margin:0 auto; padding:24px 22px 40px; flex:1; display:flex; flex-direction:column;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;}
  .brand{font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; letter-spacing:.02em;}
  .brand small{display:block; font-family:'DM Sans',sans-serif; font-size:9px; font-weight:600; letter-spacing:.18em; color:var(--gray2); margin-top:3px;}
  .langtoggle{display:flex; gap:2px; background:var(--gray1); border-radius:999px; padding:3px;}
  .langtoggle button{border:0; background:transparent; font:inherit; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; color:var(--gray2); padding:6px 13px; border-radius:999px; cursor:pointer; transition:.2s;}
  .langtoggle button.on{background:#fff; color:var(--black); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .lights{display:flex; gap:14px; justify-content:center;}
  .light{width:16px; height:16px; border-radius:50%; background:var(--gray1); border:1px solid var(--border); transition:.5s cubic-bezier(.2,.8,.2,1);}
  .light.r{background:var(--red);} .light.a{background:var(--amber);} .light.g{background:var(--green);}
  .light.dim{opacity:.16; background:var(--gray1); box-shadow:none; border-color:var(--border);}
  .light.big{width:54px; height:54px;}
  .light.pulse{animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 currentColor;}70%{box-shadow:0 0 0 16px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

  .screen{flex:1; display:flex; flex-direction:column; animation:fade .4s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
  .intro{justify-content:center; text-align:center; gap:26px;}
  .intro h1{font-size:42px; font-weight:400; line-height:1.04;}
  .intro h1.ar{font-family:'DM Sans',sans-serif; font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.18;}
  .intro p{color:var(--gray2); font-size:16px; max-width:390px; margin:0 auto;}
  .meta{display:flex; gap:26px; justify-content:center; color:var(--gray2); font-size:13px;}
  .meta b{display:block; font-family:'Bebas Neue',sans-serif; color:var(--black); font-size:30px; font-weight:400; line-height:1;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer; font:inherit; font-family:'DM Sans',sans-serif; font-weight:600; font-size:16px; padding:16px 26px; border-radius:999px; background:var(--blue); color:#fff; transition:.2s; width:100%; text-decoration:none;}
  .btn:hover{background:var(--blue2);}
  .btn:active{transform:scale(.985);}
  .btn.ghost{background:var(--gray1); color:var(--black);}
  .btn.ghost:hover{background:#ececf0;}

  .prog{margin-bottom:26px;}
  .progbar{height:5px; background:var(--gray1); border-radius:999px; overflow:hidden;}
  .progfill{height:100%; background:var(--blue); border-radius:999px; transition:width .35s cubic-bezier(.2,.8,.2,1); width:0;}
  .progtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12px; color:var(--gray2);}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gray2);}

  .q{flex:1; display:flex; flex-direction:column;}
  .q h2{font-size:25px; font-weight:700; letter-spacing:-.02em; line-height:1.28; margin:14px 0 28px;}
  .opts{display:flex; flex-direction:column; gap:12px; margin-top:auto;}
  .opt{display:flex; align-items:center; gap:14px; text-align:start; border:1.5px solid var(--border); background:var(--white); border-radius:var(--radius); padding:18px; cursor:pointer; font:inherit; font-size:16px; color:var(--black); transition:.18s; width:100%;}
  .opt:hover{border-color:#b9b9c0;}
  .opt:active{transform:scale(.99);}
  .opt .dot{flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:2px solid var(--border); transition:.18s;}
  .opt.sel{border-color:var(--blue); background:#f3f8ff;}
  .opt.sel .dot{border-color:var(--blue); background:var(--blue); box-shadow:inset 0 0 0 3px #fff;}
  .qnav{display:flex; margin-top:22px;}
  .back{background:none; border:0; font:inherit; color:var(--gray2); font-weight:600; font-size:14px; cursor:pointer; padding:10px 4px;}

  .result{text-align:center;}
  .stagebox{display:flex; flex-direction:column; align-items:center; gap:20px; margin:8px 0 4px;}
  .stagetag{font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.16em;}
  .stagename{font-size:27px; font-weight:700; letter-spacing:-.02em;}
  .scorebig{font-size:14px; color:var(--gray2); font-weight:600;}
  .scorebig b{font-family:'Bebas Neue',sans-serif; font-size:52px; color:var(--black); font-weight:400; vertical-align:-4px; margin-inline-end:4px;}
  .diag{color:var(--gray2); font-size:16px; max-width:430px; margin:8px auto 0;}
  .card{background:var(--gray1); border-radius:var(--radius); padding:22px; margin-top:24px; text-align:start;}
  .card .label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gray2);}
  .card .pkg{font-size:22px; font-weight:700; margin:4px 0 6px; letter-spacing:-.02em;}
  .card .pkgdesc{color:var(--gray2); font-size:14px;}
  .breakdown{margin-top:24px; text-align:start;}
  .brow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .brow:last-child{border-bottom:0;}
  .brow .bname{flex:1; font-size:14px; font-weight:600;}
  .brow .btrack{flex:0 0 88px; height:6px; background:var(--gray1); border-radius:999px; overflow:hidden;}
  .brow .bfill{height:100%; border-radius:999px;}
  .brow .bval{flex:0 0 40px; text-align:end; font-size:13px; color:var(--gray2); font-variant-numeric:tabular-nums;}
  .cta{margin-top:28px; display:flex; flex-direction:column; gap:10px;}
  .restart{background:none;border:0;color:var(--gray2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:8px;}
  .foot{margin-top:30px; text-align:center; font-size:11px; color:var(--gray3); letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">DDC<small>DEAL · DEVELOP · CLOSE</small></div>
    <div class="langtoggle">
      <button id="ar" class="on" onclick="setLang('ar')">عربي</button>
      <button id="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ===== CONFIG ===== */
const WA_NUMBER = "96551330394";                       // رقم واتساب DDC
const SITE_URL  = "https://ddcbusinesskw-cpu.github.io/ddc-business/";  // الموقع

const DIMS=[{ar:"الهيكل والأدوار",en:"Structure & Roles"},{ar:"التحكم والرؤية",en:"Control & Visibility"},{ar:"الحماية والسرية",en:"Protection & Confidentiality"},{ar:"المبيعات والأتمتة",en:"Sales & Automation"}];

const Q=[
 {d:0,ar:"هل لكل شخص في الشركة وصف وظيفي موثّق؟",en:"Does everyone have a documented job description?",o:[{ar:"لا يوجد شيء",en:"Nothing exists",p:0},{ar:"موجود في رؤوس الناس فقط",en:"Only in people's heads",p:1},{ar:"موثّق وموقّع",en:"Documented and signed",p:2}]},
 {d:0,ar:"هل الصلاحيات المالية محددة بحدود اعتماد واضحة؟",en:"Are financial authorities defined with clear thresholds?",o:[{ar:"أي شخص يصرف بحرية",en:"Anyone spends freely",p:0},{ar:"مدير واحد يعتمد كل شيء",en:"One manager approves all",p:1},{ar:"حدود واضحة لكل مستوى",en:"Clear thresholds per level",p:2}]},
 {d:0,ar:"هل الاجتماعات الإدارية منتظمة وموثّقة؟",en:"Are management meetings regular and documented?",o:[{ar:"لا اجتماعات رسمية",en:"No formal meetings",p:0},{ar:"اجتماعات عند الحاجة",en:"Ad-hoc meetings",p:1},{ar:"أسبوعية مع محضر مكتوب",en:"Weekly with written minutes",p:2}]},
 {d:1,ar:"هل تصل لأرقام مبيعاتك اليومية فوراً؟",en:"Can you access daily sales numbers instantly?",o:[{ar:"تعرفها نهاية الشهر",en:"Only at month's end",p:0},{ar:"خلال أسبوع",en:"Within a week",p:1},{ar:"لوحة تحكم لحظية",en:"Real-time dashboard",p:2}]},
 {d:1,ar:"هل تعرف حالة أي طلب عميل الآن؟",en:"Can you check any order's status right now?",o:[{ar:"أسأل الموظف المسؤول",en:"I ask the employee",p:0},{ar:"أراجع ملفات متفرقة",en:"I review scattered files",p:1},{ar:"نظام تتبّع مركزي",en:"Centralized tracking",p:2}]},
 {d:1,ar:"هل تعرف مَن دخل مقرّ شركتك أمس؟",en:"Do you know who entered your premises yesterday?",o:[{ar:"لا مراقبة",en:"No monitoring",p:0},{ar:"سجل ورقي",en:"A paper log",p:1},{ar:"نظام رقمي تلقائي",en:"Automatic digital system",p:2}]},
 {d:2,ar:"هل بيانات العملاء محمية من الوصول غير المصرّح؟",en:"Is client data protected from unauthorized access?",o:[{ar:"كل شيء مفتوح ومشترك",en:"Shared openly",p:0},{ar:"كلمة مرور واحدة مشتركة",en:"One shared password",p:1},{ar:"صلاحيات محددة حسب الدور",en:"Role-based permissions",p:2}]},
 {d:2,ar:"هل يوقّع الموظفون اتفاقية عدم إفشاء قبل المباشرة؟",en:"Do employees sign an NDA before starting?",o:[{ar:"لا يوجد شيء",en:"Nothing",p:0},{ar:"اتفاق شفهي فقط",en:"Verbal only",p:1},{ar:"NDA موقّعة للجميع",en:"Signed NDA for all",p:2}]},
 {d:2,ar:"هل عقود الموردين والعملاء موثّقة ومنظّمة؟",en:"Are contracts documented and organized?",o:[{ar:"أوراق في أدراج متفرقة",en:"Scattered drawers",p:0},{ar:"مجلد رقمي غير منظّم",en:"Unorganized digital folder",p:1},{ar:"أرشفة مرقّمة قابلة للبحث",en:"Numbered, searchable archive",p:2}]},
 {d:2,ar:"هل لديك خطة لو ترك موظف رئيسي العمل غداً؟",en:"A plan if a key employee leaves tomorrow?",o:[{ar:"لا خطة",en:"No plan",p:0},{ar:"أفكار غير موثّقة",en:"Undocumented ideas",p:1},{ar:"خطة خلافة مكتوبة وحديثة",en:"Written succession plan",p:2}]},
 {d:3,ar:"هل تتتبّع رحلة كل عميل محتمل حتى الإغلاق؟",en:"Do you track each prospect to closing?",o:[{ar:"لا تتبّع",en:"No tracking",p:0},{ar:"ملاحظات شخصية",en:"Personal notes",p:1},{ar:"CRM منظّم وحديث",en:"Organized CRM",p:2}]},
 {d:3,ar:"هل تذكيرات متابعة العملاء أوتوماتيكية؟",en:"Are follow-up reminders automatic?",o:[{ar:"تعتمد على الذاكرة",en:"Rely on memory",p:0},{ar:"تقويم شخصي",en:"Personal calendar",p:1},{ar:"أتمتة كاملة",en:"Full automation",p:2}]},
 {d:3,ar:"هل عروضك موحّدة وتُرسَل خلال ساعة من الطلب؟",en:"Proposals standardized & sent within an hour?",o:[{ar:"تُبنى من الصفر كل مرة",en:"From scratch each time",p:0},{ar:"قالب جزئي",en:"Partial template",p:1},{ar:"قالب كامل يُرسل فوراً",en:"Complete template, instant",p:2}]}
];

const STAGES=[
 {max:6,cls:"r",tag:"RED",ar:"الفوضى المؤسسية",en:"Institutional Chaos",
  diagAr:"الشركة تعمل بالاعتماد على الأشخاص لا الأنظمة. ابدأ فوراً بالأساسيات: تعريف الأدوار، الصلاحيات المالية، وتوقيع العقود.",
  diagEn:"The business runs on people, not systems. Start with the basics: roles, financial authorities, and signed contracts.",
  pkgAr:"باقة التأسيس",pkgEn:"Foundation Package",
  pdAr:"30 إجراء تشغيلي موثّق + خارطة طريق + تشخيص للوضع الحالي.",pdEn:"30 documented SOPs + roadmap + current-state diagnosis."},
 {max:13,cls:"a",tag:"YELLOW",ar:"النمو غير المتوازن",en:"Unbalanced Growth",
  diagAr:"عندك أنظمة جزئية لكنها متفرقة. الخطوة التالية: سدّ الفجوات الحرجة، ربط الأنظمة، وبناء لوحة تحكم أولية.",
  diagEn:"You have partial but disconnected systems. Next: close gaps, connect them, and build an initial dashboard.",
  pkgAr:"الباقة المتكاملة",pkgEn:"Integrated Package",
  pdAr:"كل ما في التأسيس + لوحة تحكم + أتمتة 3 عمليات حرجة + تدريب الفريق.",pdEn:"Foundation + dashboard + automating 3 workflows + team training."},
 {max:20,cls:"g",tag:"GREEN",ar:"جاهز للتوسّع",en:"Ready to Scale",
  diagAr:"أنظمتك تعمل. حسّن الموجود، ابنِ تحليلات تنبؤية، وجهّز للخلافة أو الشراكات الاستراتيجية.",
  diagEn:"Your systems work. Improve them, build predictive analytics, and prepare for succession or partnerships.",
  pkgAr:"الباقة الشاملة",pkgEn:"Comprehensive Package",
  pdAr:"حوكمة كاملة + أنظمة متقدمة + تدريب القيادة + ضمان تشغيلي 6 أشهر + مرافقة شهرية.",pdEn:"Full governance + advanced systems + leadership training + 6-month guarantee + monthly accompaniment."},
 {max:26,cls:"g",tag:"ELITE",ar:"مؤسسة نموذجية",en:"Elite",
  diagAr:"أنت نموذج يُحتذى. الأنسب: مرافقة شهرية فقط، أو شراكة استراتيجية، أو تحويل تجربتك إلى دراسة حالة منشورة.",
  diagEn:"You're a model organization. The fit: monthly accompaniment, a strategic partnership, or a published case study.",
  pkgAr:"المرافقة الشهرية / شراكة",pkgEn:"Monthly Accompaniment / Partnership",
  pdAr:"4 ساعات شهرياً مراجعة وتحسين ودعم مباشر، أو استكشاف شراكة.",pdEn:"4 hours/month of review, improvement, and support — or a partnership."}
];

const T={
 ar:{introH:"ما مرحلة نضج شركتك؟",introP:"13 سؤالاً سريعاً يكشفون أين تقف شركتك العائلية اليوم — ويحددون خطوتك التالية بدقة.",
   m1:"دقائق",m1v:"3",m2:"أسئلة",m2v:"13",m3:"النتيجة",m3v:"فوراً",
   start:"ابدأ التقييم",q:"السؤال",of:"من",back:"رجوع",yourScore:"نتيجتك من 26",
   recoLabel:"الباقة الموصى بها",breakTitle:"التفصيل حسب البُعد",
   cta:"احجز استشارة مجانية",site:"زيارة الموقع",restart:"إعادة التقييم",
   foot:"تقييم النضج المؤسسي · إطار الأنوار الثلاثة",
   waMsg:(s,n)=>`مرحباً عمر، أنهيت تقييم النضج المؤسسي ونتيجتي ${n}/26 — مرحلة «${s}». أريد حجز استشارة.`},
 en:{introH:"What's your maturity stage?",introP:"13 quick questions reveal where your family business stands today — and pinpoint your next move.",
   m1:"minutes",m1v:"3",m2:"questions",m2v:"13",m3:"result",m3v:"instant",
   start:"Start assessment",q:"Question",of:"of",back:"Back",yourScore:"your score out of 26",
   recoLabel:"Recommended package",breakTitle:"Breakdown by dimension",
   cta:"Book a free consultation",site:"Visit website",restart:"Retake",
   foot:"Institutional Maturity Assessment · Three Lights Framework",
   waMsg:(s,n)=>`Hi Omar, I finished the Institutional Maturity Assessment. My score is ${n}/26 — "${s}" stage. I'd like to book a consultation.`}
};

let state={lang:"ar",screen:"intro",i:0,answers:Array(Q.length).fill(null)};
function setLang(l){state.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.getElementById("ar").classList.toggle("on",l==="ar");document.getElementById("en").classList.toggle("on",l==="en");render();}
const L=()=>T[state.lang];
const tx=o=>state.lang==="ar"?o.ar:o.en;
function render(){const a=document.getElementById("app");a.innerHTML=state.screen==="intro"?introHTML():state.screen==="q"?qHTML():resultHTML();}

function introHTML(){const t=L();const isAr=state.lang==="ar";
 return `<div class="screen intro">
  <div class="lights"><span class="light r pulse" style="color:var(--red)"></span><span class="light a"></span><span class="light g"></span></div>
  <h1 class="${isAr?'ar':'display'}">${t.introH}</h1>
  <p>${t.introP}</p>
  <div class="meta"><div><b>${t.m1v}</b>${t.m1}</div><div><b>${t.m2v}</b>${t.m2}</div><div><b>${t.m3v}</b>${t.m3}</div></div>
  <div style="margin-top:8px"><button class="btn" onclick="begin()">${t.start}</button></div>
 </div>`;}
function begin(){state.screen="q";state.i=0;render();}

function qHTML(){const t=L();const q=Q[state.i];const pct=Math.round((state.i/Q.length)*100);const sel=state.answers[state.i];
 const opts=q.o.map((o,idx)=>`<button class="opt ${sel===idx?'sel':''}" onclick="choose(${idx})"><span class="dot"></span><span>${tx(o)}</span></button>`).join("");
 return `<div class="screen q">
  <div class="prog"><div class="progtop"><span class="eyebrow">${tx(DIMS[q.d])}</span><span>${t.q} ${state.i+1} ${t.of} ${Q.length}</span></div><div class="progbar"><div class="progfill" style="width:${pct}%"></div></div></div>
  <h2>${tx(q)}</h2>
  <div class="opts">${opts}</div>
  <div class="qnav">${state.i>0?`<button class="back" onclick="prev()">← ${t.back}</button>`:""}</div>
 </div>`;}
function choose(idx){state.answers[state.i]=idx;render();setTimeout(()=>{if(state.i<Q.length-1){state.i++;render();}else{state.screen="result";render();}},220);}
function prev(){if(state.i>0){state.i--;render();}}

function calc(){let total=0;const byDim=[0,0,0,0];const maxDim=[6,6,8,6];Q.forEach((q,i)=>{const p=q.o[state.answers[i]].p;total+=p;byDim[q.d]+=p;});const stage=STAGES.find(s=>total<=s.max);return{total,byDim,maxDim,stage};}

function resultHTML(){const t=L();const{total,byDim,maxDim,stage}=calc();
 const lights=["r","a","g"].map(c=>{const on=(stage.cls===c)||(stage.tag==="ELITE"&&c==="g");return `<span class="light ${c} ${on?'big pulse':'dim'}" style="color:var(--${c==='r'?'red':c==='a'?'amber':'green'})"></span>`;}).join("");
 const cv=stage.cls==="r"?"--red":stage.cls==="a"?"--amber":"--green";
 const rows=DIMS.map((d,i)=>{const pc=Math.round((byDim[i]/maxDim[i])*100);return `<div class="brow"><span class="bname">${tx(d)}</span><span class="btrack"><span class="bfill" style="width:${pc}%;background:var(${cv})"></span></span><span class="bval">${byDim[i]}/${maxDim[i]}</span></div>`;}).join("");
 const stageName=state.lang==="ar"?stage.ar:stage.en;
 const waLink=`https://wa.me/${WA_NUMBER}?text=`+encodeURIComponent(t.waMsg(stageName,total));
 return `<div class="screen result">
  <div class="stagebox">
    <div class="lights">${lights}</div>
    <div><div class="stagetag" style="color:var(${cv})">${stage.tag}</div><div class="stagename">${stageName}</div></div>
    <div class="scorebig"><b>${total}</b>/26 — ${t.yourScore}</div>
  </div>
  <p class="diag">${state.lang==="ar"?stage.diagAr:stage.diagEn}</p>
  <div class="card"><div class="label">${t.recoLabel}</div><div class="pkg">${state.lang==="ar"?stage.pkgAr:stage.pkgEn}</div><div class="pkgdesc">${state.lang==="ar"?stage.pdAr:stage.pdEn}</div></div>
  <div class="breakdown"><div class="label" style="margin-bottom:6px">${t.breakTitle}</div>${rows}</div>
  <div class="cta">
    <a class="btn" href="${waLink}" target="_blank" rel="noopener">${t.cta}</a>
    <a class="btn ghost" href="${SITE_URL}" target="_blank" rel="noopener">${t.site}</a>
    <button class="restart" onclick="resetAll()">${t.restart}</button>
  </div>
  <div class="foot">DDC · ${t.foot}</div>
 </div>`;}
